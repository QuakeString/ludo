# Builds an Android app you can put on a phone.
#
# There is no Mac in this pipeline, so there is no iOS build here and there
# cannot be one: an installable iOS app needs Xcode to compile it and an Apple
# developer identity to sign it, neither of which a Linux runner has.
#
# The APK is signed with a fixed key from the repository's secrets (see the
# "Signing key" step), so each build installs over the last. It is a
# side-loading key, not a Play Store upload key.
name: Android

on:
  push:
    branches: [claude/ludo-board-game-design-qd5nm3]
    paths:
      - 'app/**'
      - 'packages/**'
      - '.github/workflows/android.yml'
  # Pull requests build the APK too, so a change that breaks the Android build
  # is caught before it lands rather than after. Only a push publishes it.
  pull_request:
    paths:
      - 'app/**'
      - 'packages/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      # The same key for every build, so a new APK installs over the last one.
      # Kept in the repository's secrets: ANDROID_KEYSTORE (the .jks file,
      # base64) and ANDROID_KEYSTORE_PASSWORD. Without them the build falls
      # back to a debug key made fresh on this runner, and each APK then has
      # to be installed over an uninstall. That is fine for a pull request's
      # check build, which nobody installs, but a published build without
      # the key would refuse to update every phone that has the app, so a
      # push without it fails here instead of publishing.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PUBLISHING: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/ludo.jks"
            echo "LUDO_KEYSTORE=$RUNNER_TEMP/ludo.jks" >> "$GITHUB_ENV"
            echo "Signing with the repository's key."
          elif [ "$PUBLISHING" = "true" ]; then
            echo "::error::No ANDROID_KEYSTORE secret; refusing to publish an APK that cannot update installed copies."
            exit 1
          else
            echo "::warning::No ANDROID_KEYSTORE secret; signing with a throwaway debug key."
          fi

      - name: Fetch packages
        working-directory: app
        run: flutter pub get

      # One APK carrying every processor, rather than a set split per ABI:
      # it is a larger download, and it is the one that always installs on
      # whichever phone it is handed to.
      - name: Build
        working-directory: app
        env:
          LUDO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name="1.0.${GITHUB_RUN_NUMBER}" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=LUDO_BUILD="${GITHUB_RUN_NUMBER}"
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk ../out/ludo.apk
          # What installed copies read to learn a newer build is out.
          echo "{\"build\": ${GITHUB_RUN_NUMBER}}" > ../out/version.json
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: ludo-apk
          path: out/ludo.apk

      # A release on a fixed tag, so the download link never changes and can
      # be opened straight from a phone.
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phone
          name: Ludo for Android
          body: |
            The current build, straight off the branch.

            **[Download ludo.apk](https://github.com/${{ github.repository }}/releases/download/phone/ludo.apk)**

            Android will warn you before installing an app from outside the
            Play Store; allow it for your browser and the install goes through.
            Signed with a side-loading key, so it installs and plays but is
            not Play Store material.

            Built from `${{ github.sha }}` (run ${{ github.run_number }}).
          files: |
            out/ludo.apk
            out/version.json
          prerelease: true
          make_latest: false
