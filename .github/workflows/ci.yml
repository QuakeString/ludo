name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  engine:
    name: Rules engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ludo_engine
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test

      - name: Play a game end to end
        run: |
          dart run example/play_a_game.dart --rules=classic --seed=1
          dart run example/play_a_game.dart --rules=teams --seed=42
