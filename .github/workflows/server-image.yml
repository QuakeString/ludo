# Publishes the game server's Docker image to GitHub's container registry, so
# a VPS can run the latest server with `docker compose pull && docker compose
# up -d` instead of building it. See DEPLOY.md.
name: Server image

on:
  push:
    branches: [claude/ludo-board-game-design-qd5nm3]
    paths:
      - 'server/**'
      - 'packages/ludo_engine/**'
      - 'packages/ludo_protocol/**'
      - '.github/workflows/server-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/quakestring/ludo-server:latest
            ghcr.io/quakestring/ludo-server:${{ github.sha }}
