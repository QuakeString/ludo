# The online game server, ready for a VPS. See DEPLOY.md.
#
#   docker compose up -d                   # server on port 8080, plain ws://
#   docker compose --profile https up -d   # plus Caddy with HTTPS on 80/443
#
# Players, friends and match history live in one JSON file on the ludo-data
# volume, so a restart or an upgrade keeps them.

services:
  server:
    image: ghcr.io/quakestring/ludo-server:latest
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATA_DIR: /data
    volumes:
      - ludo-data:/data
    restart: unless-stopped
    healthcheck:
      # The image has no shell and no curl, so the binary checks itself: run
      # with --health it queries the running server and reports through its
      # exit code.
      test: ["CMD", "/app/ludo-server", "--health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      LUDO_DOMAIN: ${LUDO_DOMAIN:?set LUDO_DOMAIN in .env to use HTTPS}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - server
    restart: unless-stopped

volumes:
  ludo-data:
  caddy-data:
